name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '17'
      ANDROID_SDK_ROOT: /usr/local/share/android-sdk
      # Temporary mitigation for workflows or actions that try to use Node 20
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Print environment (debug)
        run: |
          echo "ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=$ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          ./gradlew -v

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Decode keystore (if provided)
        if: ${{ secrets.ANDROID_KEYSTORE != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > release.keystore
          ls -l release.keystore

      - name: Zipalign + Sign APK (if keystore provided)
        if: ${{ secrets.ANDROID_KEYSTORE != '' }}
        run: |
          BUILD_TOOLS_DIR="${ANDROID_SDK_ROOT}/build-tools"
          if [ -d "$BUILD_TOOLS_DIR" ]; then
            BUILD_TOOLS_VERSION=$(ls "$BUILD_TOOLS_DIR" | sort -V | tail -n1)
            ZIPALIGN="$BUILD_TOOLS_DIR/$BUILD_TOOLS_VERSION/zipalign"
            APKSIGNER="$BUILD_TOOLS_DIR/$BUILD_TOOLS_VERSION/apksigner"
          else
            ZIPALIGN=$(which zipalign || true)
            APKSIGNER=$(which apksigner || true)
          fi

          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="app-release-aligned.apk"
          signed="app-release-signed.apk"

          if [ ! -f "$unsigned" ]; then
            echo "Unsigned APK not found at $unsigned"
            exit 1
          fi

          if [ -x "$ZIPALIGN" ]; then
            $ZIPALIGN -v -p 4 "$unsigned" "$aligned"
          else
            cp "$unsigned" "$aligned"
            echo "zipalign not found, skipped alignment (runner may already produce aligned APK)."
          fi

          if [ -x "$APKSIGNER" ]; then
            $APKSIGNER sign \
              --ks release.keystore \
              --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
              --key-pass pass:${{ secrets.KEY_PASSWORD }} \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --out "$signed" "$aligned"
            mkdir -p app/build/outputs/apk/release/
            mv "$signed" app/build/outputs/apk/release/app-release-signed.apk
          else
            echo "apksigner not found; skipping signing step."
            ls -l "$aligned"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
